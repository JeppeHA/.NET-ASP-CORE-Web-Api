services:
  webapp:
    container_name: one-review-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    environment:
      - ASPNETCORE_ENVIROMENT=Development
      - Database__ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=onereview;Username=postgres;Password=strong_password
    depends_on:
      db:
        condition: service_healthy
  db:
    container_name: one-review-db
    image: postgres:latest
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: onereview
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: strong_password
    volumes:
      - postgres_data:/var/lib/postresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d onereview"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
